<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip - Galleria</title>
  <style>
    /* Layout e sfondo */
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background-image: url('immagini/Banner_18IMPERFETTO.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #111;
      color: white;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 28px;
      box-sizing: border-box;
    }

    /* Contenitore centrale bianco-avorio */
    .message-box {
      background: #fffaf0; /* bianco avorio */
      color: #222;
      padding: 32px 28px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      max-width: 900px;
      width: 100%;
      text-align: center;
      margin: 24px 0;
    }
    .message-box h2 {
      margin: 0 0 10px 0;
      font-size: 1.6rem;
      color: #1a1a1a;
    }
    .message-box p {
      margin: 0;
      color: #333;
      line-height: 1.45;
      font-size: 1.03rem;
    }

    /* Container della galleria video */
    .clips {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      margin-bottom: 28px;
      padding: 0 8px;
      box-sizing: border-box;
    }

    .clip {
      width: 100%;
      max-width: 920px; /* larghezza massima per ogni video */
      display: flex;
      justify-content: center;
    }

    .clip video {
      width: 100%;
      height: auto;
      max-height: 480px; /* mantiene l'orientamento orizzontale senza eccedere */
      border: 0;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      background: #000;
      display: block;
    }

    /* Pulsante indietro */
    .back-wrapper {
      margin: 18px 0 40px 0;
    }
    .btn-back {
      display: inline-block;
      background: #ff0055;
      color: #fffaf0; /* testo avorio */
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .btn-back:hover { transform: translateY(-4px); background: #e6004a; }

    /* Responsive */
    @media (max-width: 900px) {
      .clip video { max-height: 420px; }
      .message-box { padding: 26px 18px; }
    }
    @media (max-width: 680px) {
      .clip video { max-height: 340px; }
      .btn-back { padding: 12px 22px; font-size: 1rem; }
    }
    @media (max-width: 480px) {
      .clip video { max-height: 220px; }
      .message-box h2 { font-size: 1.2rem; }
      .message-box p { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- Contenitore centrale bianco-avorio dove puoi scrivere il messaggio -->
  <main class="message-box" role="main" aria-label="Messaggio centrale">
    <h2>🎬 LE MIGLIORI CLIP 🎬</h2>
    <p>
      Le clip che ho ritrovato sul tuo canale Twitch in cui ci divertiamo e ridiamo, per rivivere i ricordi delle live!
    </p>
  </main>

  <!-- Video: impilati, centrati -->
  <section class="clips" aria-label="Elenco video">
    <div class="clip">
      <video controls playsinline preload="metadata" poster="immagini/clip1-poster.jpg">
        <source src="immagini/Dea_Bendata.mp4" type="video/mp4">
      </video>
    </div>

    <div class="clip">
      <video controls playsinline preload="metadata" poster="immagini/clip2-poster.jpg">
        <source src="immagini/JustinBieber.mp4" type="video/mp4">
      </video>
    </div>

    <div class="clip">
      <video controls playsinline preload="metadata" poster="immagini/clip3-poster.jpg">
        <source src="immagini/Siumm.mp4" type="video/mp4">
      </video>
    </div>

    <div class="clip">
      <video controls playsinline preload="metadata" poster="immagini/clip4-poster.jpg">
        <source src="immagini/Nword.mp4" type="video/mp4">
      </video>
    </div>


 <div class="clip">
      <video controls playsinline preload="metadata" poster="immagini/clip6-poster.jpg">
        <source src="immagini/Bingo_Sparo.mp4" type="video/mp4">
      </video>
    </div>


  </section>

  <!-- Pulsante indietro -->
  <div class="back-wrapper">
    <a class="btn-back" href="index.html" onclick="event.preventDefault(); history.back();">Indietro</a>
  </div>

</body>
</html>
